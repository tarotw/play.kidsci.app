<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>宇宙好好聽｜科學好好聽的宇宙群島</title>
<meta name="description" content="科學好好聽的宇宙群島：每一集故事都變成小居民，住在浮在天上的島。坐火箭到雨林島、恐龍島、月亮島拜訪他們，點一下就能聽故事。">
<meta property="og:title" content="宇宙好好聽・宇宙群島">
<meta property="og:description" content="坐火箭去拜訪住在浮空島上的 300 多個科學故事！">
<meta property="og:image" content="https://universe.kidsci.app/assets/logo-banner.png">
<meta property="og:url" content="https://universe.kidsci.app/">
<link rel="canonical" href="https://universe.kidsci.app/">
<meta name="theme-color" content="#9fd4ff">
<link rel="icon" href="assets/logo-square.jpg">
<link rel="stylesheet" href="style.css">
</head>
<body class="isle-page">
<div class="loading" id="loading" role="status"><img src="assets/logo-square.jpg" alt="" width="72" height="72"><p id="loading-text">火箭加油中…</p></div>
<canvas id="world" aria-label="宇宙群島：拖曳轉著看，兩指或滾輪拉近拉遠，點小居民聽故事，點別的島就坐火箭飛過去。也可以用島名下面的「居民」名單，和下面的「去別的島」。"></canvas>
<div id="isle-labels" aria-hidden="true"></div>
<div class="isle-tip" id="isle-tip" hidden></div>

<header class="hud-top">
  <a class="brand" href="./" aria-label="宇宙好好聽首頁"><img src="assets/logo-banner.png" alt="科學好好聽" width="210" height="84"></a>
  <div class="scene">
    <h1 id="isle-name">宇宙群島</h1>
    <p id="isle-meta"></p>
    <!-- 在島上：島名下面就是「這座島的居民」，一起寫出幾個可以聽、幾個 VIP、幾個還在準備 -->
    <button class="isle-people" id="people-btn" type="button" aria-haspopup="dialog" hidden><span class="who">👥 <span id="people-count"></span> <span class="more" aria-hidden="true">›</span></span><span class="legend-row" id="people-legend"></span></button>
  </div>
  <div class="hud-buttons">
    <button class="round guide-btn" id="guide-btn" type="button" aria-label="找科學隊長"><img src="assets/avatar-captain.png" alt=""></button>
    <button class="round" id="sound-btn" type="button" aria-pressed="true" aria-label="音效">🔊</button>
    <button class="logbook" id="logbook-btn" type="button" aria-haspopup="dialog" aria-label="航行日誌"><span class="label">航行日誌</span> <span id="stamp-count">0</span></button>
  </div>
</header>

<section class="guide" id="guide" hidden tabindex="0" aria-live="polite" aria-label="科學隊長與好奇博士"></section>

<nav class="isle-bar" aria-label="去別的島">
  <button class="isle-btn rocket" id="station-btn" type="button" aria-haspopup="dialog"><span class="ico">🚀</span><span class="txt">去別的島</span></button>
  <button class="isle-map" id="map-btn" type="button"><span class="ico" id="map-ico">🗺️</span><span class="txt" id="map-txt">全部的島</span></button>
</nav>

<dialog id="station" class="sheet" aria-labelledby="station-title"></dialog>
<dialog id="people" class="sheet" aria-labelledby="people-title"></dialog>
<dialog id="channel" class="sheet" aria-labelledby="ch-title"></dialog>
<dialog id="lab" class="labsheet" aria-label="實驗">
  <div class="labbar"><span id="lab-title"></span><button type="button" id="lab-close">關閉實驗</button></div>
  <iframe id="lab-frame" title="lab 實驗" allow="fullscreen"></iframe>
</dialog>
<dialog id="journal" class="sheet" aria-labelledby="journal-title"></dialog>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<div class="player" id="player" hidden>
  <div class="now"><strong id="now-title"></strong><span id="now-takeaway"></span></div>
  <audio id="audio" controls preload="none"></audio>
</div>

<script type="importmap">{"imports":{"three":"./vendor/three/three.module.min.js","three/addons/":"./vendor/three/addons/"}}</script>
<script src="islands.js" type="module"></script>
</body>
</html>
