<!doctype html>
<!-- 分享縮圖（assets/og-cover.jpg）的版面。背景 shot.png 由 make_og.mjs 拍 3D 畫面產生。 --><html lang="zh-Hant"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@700;900&display=block" rel="stylesheet">
<style>
  html,body{margin:0;width:1200px;height:630px;overflow:hidden}
  body{position:relative;font-family:"Noto Sans TC",sans-serif;background:#9fd4ff}
  .bg{position:absolute;inset:0;background:url(shot.png) center/cover}
  .fade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(255,255,255,.92) 0%,rgba(255,255,255,.78) 30%,rgba(255,255,255,.25) 50%,rgba(255,255,255,0) 62%)}
  .box{position:absolute;left:64px;top:56px;width:600px}
  .logo{height:84px;display:block;filter:drop-shadow(0 4px 10px rgba(40,40,90,.25))}
  h1{margin:26px 0 0;font-weight:900;font-size:88px;line-height:1.08;color:#2f347e;letter-spacing:.02em}
  h1 .dash{color:#ff7a4a;margin:0 .04em}
  h1 small{display:block;font-size:110px;background:linear-gradient(90deg,#ff7a4a,#ffb02e);-webkit-background-clip:text;color:transparent;filter:drop-shadow(0 3px 0 #fff)}
  p{margin:22px 0 0;font-weight:700;font-size:31px;line-height:1.45;color:#3b4078}
  .chips{display:flex;gap:10px;margin-top:22px}
  .chip{padding:6px 16px;border-radius:999px;background:#fff;border:3px solid #ffd7c4;font-weight:900;font-size:24px;color:#e8692f;box-shadow:0 4px 12px rgba(80,70,140,.18)}
  .duo{position:absolute;right:46px;bottom:34px;display:flex;gap:-10px}
  .duo img{width:108px;height:108px;border-radius:50%;border:6px solid #fff;box-shadow:0 8px 24px rgba(40,40,90,.3);background:#fff}
  .duo img+img{margin-left:-22px}
  .url{position:absolute;right:52px;top:40px;padding:8px 18px;border-radius:999px;background:rgba(255,255,255,.9);font-weight:900;font-size:24px;color:#2f347e;box-shadow:0 4px 14px rgba(40,40,90,.2)}
</style></head><body>
<div class="bg"></div><div class="fade"></div>
<div class="box">
  <img class="logo" src="../../assets/logo-banner.png" alt="">
  <h1>科學好好聽<small>宇宙島</small></h1>
  <p>上百個兒童科學故事住在浮空島上，<br>坐火箭去拜訪他們！</p>
  <div class="chips"><span class="chip">🦕 恐龍</span><span class="chip">🐋 動物</span><span class="chip">🚀 太空</span><span class="chip">⚛️ 科學</span></div>
</div>
<div class="url">play.kidsci.app</div>
<div class="duo"><img src="../../assets/avatar-captain.png" alt=""><img src="../../assets/avatar-curious.png" alt=""></div>
</body></html>
