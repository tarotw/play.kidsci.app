name: probe apple
on:
  push:
    branches: [probe-apple]
    paths: ['probe/run.py', '.github/workflows/probe-apple.yml']
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python3 probe/run.py
      - run: |
          git config user.name github-actions; git config user.email github-actions@users.noreply.github.com
          git add probe/out && git commit -m "probe results [skip ci]" && git push
