name: 上架狀態檢查與目錄更新

on:
  schedule:
    - cron: '43 23 * * *'   # 台灣時間每天 07:43，listensci 抓完 feed 之後
  workflow_dispatch: {}
  push:
    paths:
      - 'data/placements.json'
      - 'data/feed_overrides.json'
      - 'data/tag_rules.json'
      - 'data/labs.json'
      - 'tools/**'

permissions:
  contents: write

# 同時只跑一個（排隊，不取消）
concurrency:
  group: status
  cancel-in-progress: false

jobs:
  status:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 上架狀態檢查（Firstory、Apple Podcasts，設定後含 Spotify）
        env:
          SPOTIFY_SHOW_ID: ${{ secrets.SPOTIFY_SHOW_ID }}
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
        run: python3 tools/status_check.py
      - name: 找每一集的 Apple Podcasts、Spotify 連結
        continue-on-error: true
        env:
          SPOTIFY_SHOW_ID: ${{ secrets.SPOTIFY_SHOW_ID }}
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
        run: python3 tools/platform_links.py
      - name: 重建 catalog.json
        run: python3 tools/build_catalog.py
      - name: 補上新故事的科學隊長女聲音檔
        continue-on-error: true
        run: |
          python3 -m pip install edge-tts==7.3.1
          python3 tools/build_speech_audio.py
      - name: 更新 SEO 文字版、sitemap
        run: python3 tools/build_seo.py
      - name: 有變動就提交
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/status.json data/catalog.json data/platforms.json STATUS.md index.html sitemap.xml robots.txt assets/speech
          git diff --cached --quiet && exit 0
          git commit -m "更新上架狀態與目錄"
          # 跑的時候別人也推了東西：先接上最新的再推（這裡只改資料檔，不會衝突），最多試三次
          for i in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            sleep 5
          done
          exit 1
